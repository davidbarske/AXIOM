name: Temporary Moses Tembe transcription

on:
  push:
    branches:
      - temp-moses-tembe-transcription
    paths:
      - .github/workflows/transcribe-moses-tembe.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/transcribe-moses-tembe.yml

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp-moses-tembe-transcription
          fetch-depth: 0

      - name: Install transcription tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper requests

      - name: Obtain and prepare speech audio
        id: download
        continue-on-error: true
        run: |
          mkdir -p transcription-output
          cat > /tmp/download_audio.py <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import urllib.request

          video_id = 'pVDYRrxG6d4'
          instances = [
              'https://pipedapi.kavin.rocks',
              'https://pipedapi.leptons.xyz',
              'https://pipedapi.nosebs.ru',
              'https://pipedapi-libre.kavin.rocks',
              'https://piped-api.privacy.com.de',
              'https://pipedapi.adminforge.de',
              'https://api.piped.yt',
              'https://pipedapi.drgns.space',
              'https://pipedapi.owo.si',
              'https://pipedapi.ducks.party',
              'https://piped-api.codespace.cz',
              'https://pipedapi.reallyaweso.me',
              'https://api.piped.private.coffee',
              'https://pipedapi.darkness.services',
              'https://pipedapi.orangenet.cc',
          ]
          log_path = pathlib.Path('transcription-output/download.log')
          headers = {'User-Agent': 'Mozilla/5.0 Moses-Tembe-transcription/1.0'}
          errors = []

          def log(message):
              print(message, flush=True)
              with log_path.open('a', encoding='utf-8') as fh:
                  fh.write(message + '\n')

          log_path.write_text('', encoding='utf-8')
          for base in instances:
              try:
                  endpoint = f'{base}/streams/{video_id}'
                  log(f'===== Trying Piped API: {endpoint} =====')
                  req = urllib.request.Request(endpoint, headers=headers)
                  with urllib.request.urlopen(req, timeout=35) as response:
                      payload = json.load(response)
                  streams = [s for s in payload.get('audioStreams', []) if s.get('url')]
                  if not streams:
                      raise RuntimeError('No audio streams returned')
                  streams.sort(key=lambda s: int(s.get('bitrate') or 0), reverse=True)
                  for stream in streams:
                      url = stream['url']
                      log(f"Trying stream {stream.get('quality')} {stream.get('mimeType')} from {base}")
                      cmd = [
                          'ffmpeg', '-y', '-headers', 'User-Agent: Mozilla/5.0\r\n',
                          '-i', url, '-ar', '16000', '-ac', '1', '-c:a', 'pcm_s16le',
                          'moses_tembe_16k.wav'
                      ]
                      proc = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=240)
                      if proc.returncode == 0 and pathlib.Path('moses_tembe_16k.wav').stat().st_size > 1_000_000:
                          log(f'Download succeeded through {base}')
                          sys.exit(0)
                      log(f'ffmpeg failed for stream: {proc.stdout[-1200:]}')
              except Exception as exc:
                  errors.append(f'{base}: {type(exc).__name__}: {exc}')
                  log(errors[-1])
          log('All Piped methods failed.')
          sys.exit(1)
          PY
          python /tmp/download_audio.py

      - name: Transcribe with Whisper small.en
        if: steps.download.outcome == 'success'
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import json

          AUDIO = 'moses_tembe_16k.wav'
          OUT = Path('transcription-output')
          OUT.mkdir(exist_ok=True)

          model = WhisperModel('small.en', device='cpu', compute_type='int8', cpu_threads=4)
          segments, info = model.transcribe(
              AUDIO,
              language='en',
              beam_size=5,
              best_of=5,
              vad_filter=True,
              vad_parameters=dict(min_silence_duration_ms=500),
              condition_on_previous_text=True,
              initial_prompt=(
                  'Moses Tembe speaking at the 2020 Christian Business Gathering in South Africa. '
                  'Topics include Christian faith, God, Jesus Christ, ethical leadership, business, '
                  'entrepreneurship, KwaZulu-Natal, Durban, economic development and South Africa.'
              ),
              word_timestamps=True,
          )
          segments = list(segments)

          def stamp(seconds: float) -> str:
              total = max(0, int(round(seconds)))
              h, rem = divmod(total, 3600)
              m, s = divmod(rem, 60)
              return f'{h:02d}:{m:02d}:{s:02d}'

          def srt_stamp(seconds: float) -> str:
              ms = max(0, int(round(seconds * 1000)))
              h, rem = divmod(ms, 3_600_000)
              m, rem = divmod(rem, 60_000)
              s, ms = divmod(rem, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          txt_lines = [
              'MOSES TEMBE — 2020 CHRISTIAN BUSINESS GATHERING',
              'Machine-assisted working transcript from the supplied speech recording.',
              'Speaker label: Moses Tembe. Low-confidence passages are marked for review.',
              '',
          ]
          srt_lines = []
          records = []

          for idx, seg in enumerate(segments, 1):
              text = seg.text.strip()
              low = seg.avg_logprob < -0.85 or seg.no_speech_prob > 0.55
              marker = ' [LOW CONFIDENCE]' if low else ''
              txt_lines.append(f'[{stamp(seg.start)}–{stamp(seg.end)}] Moses Tembe{marker}: {text}')
              srt_lines.extend([
                  str(idx),
                  f'{srt_stamp(seg.start)} --> {srt_stamp(seg.end)}',
                  f'Moses Tembe: {text}{marker}',
                  '',
              ])
              records.append({
                  'index': idx,
                  'start': seg.start,
                  'end': seg.end,
                  'text': text,
                  'avg_logprob': seg.avg_logprob,
                  'no_speech_prob': seg.no_speech_prob,
                  'compression_ratio': seg.compression_ratio,
                  'low_confidence': low,
                  'words': [
                      {'start': w.start, 'end': w.end, 'word': w.word, 'probability': w.probability}
                      for w in (seg.words or [])
                  ],
              })

          (OUT / 'Moses_Tembe_Speech_working_transcript.txt').write_text('\n'.join(txt_lines) + '\n', encoding='utf-8')
          (OUT / 'Moses_Tembe_Speech_working_transcript.srt').write_text('\n'.join(srt_lines), encoding='utf-8')
          (OUT / 'Moses_Tembe_Speech_segments.json').write_text(
              json.dumps({
                  'language': info.language,
                  'language_probability': info.language_probability,
                  'duration': info.duration,
                  'duration_after_vad': info.duration_after_vad,
                  'segments': records,
              }, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          PY
          python /tmp/transcribe.py

      - name: Commit temporary output or diagnostics
        if: always() && github.event_name == 'push'
        run: |
          git config user.name 'Temporary transcription workflow'
          git config user.email 'actions@users.noreply.github.com'
          git add transcription-output/
          git diff --cached --quiet && exit 0
          git commit -m 'Add temporary transcription output or diagnostics [skip ci]'
          git push origin HEAD:temp-moses-tembe-transcription
